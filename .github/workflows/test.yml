name: Test
on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize]

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check spelling with typos
        uses: crate-ci/typos@v1

      - name: Check C++ and Proto formatting
        run: |
          sudo apt-get update && \
          sudo apt-get install -y --no-install-recommends clang-format
          clang-format --dry-run --Werror src/*.cc src/*.proto

      - name: Check Markdown and JSON formatting
        uses: dprint/check@v2.2

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version:
          - name: latest
            debian_version: bookworm-slim
            grpc_version: v1.66.2
          - name: legacy
            debian_version: bullseye-slim
            grpc_version: v1.37.1
        arch:
          - name: armhf
            gnu_host: arm-linux-gnueabihf
            qemu_arch: arm
            sysroot_pkg: libc6-dev-armhf-cross
          - name: aarch64
            gnu_host: aarch64-linux-gnu
            qemu_arch: aarch64
            sysroot_pkg: libc6-dev-arm64-cross
    name: test (${{ matrix.version.name }}, ${{ matrix.arch.name }})
    steps:
      - name: Setup deps
        run: |
          sudo apt-get update && \
          sudo apt-get install -y \
            gcc-${{ matrix.arch.gnu_host }} \
            ${{ matrix.arch.sysroot_pkg }} \
            qemu-user
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # https://docs.github.com/en/actions/using-workflows/caching-dependencies-to-speed-up-workflows
      - name: Cache Docker
        uses: actions/cache@v4
        env:
          cache-name: docker-cache
        with:
          path: /tmp/cache
          key: ${{ runner.os }}-${{ matrix.version.name }}-${{ matrix.arch.name }}-${{ env.cache-name }}-${{ hashFiles('src/*', 'Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.version.name }}-${{ matrix.arch.name }}-${{ env.cache-name }}-
            ${{ runner.os }}-${{ matrix.version.name }}-${{ matrix.arch.name }}-
            ${{ runner.os }}-${{ matrix.version.name }}-

      - name: Compile the binaries
        env:
          BUILDX_BAKE_ENTITLEMENTS_FS: "0"
          GNU_HOST: ${{ matrix.arch.gnu_host }}
          DEBIAN_VERSION: ${{ matrix.version.debian_version }}
          GRPC_VERSION: ${{ matrix.version.grpc_version }}
          CACHE: /tmp/cache
        run: docker buildx bake --allow=fs=/tmp

      # NOTE: Target binaries require target glibc <= runner sysroot glibc.
      - name: Verify the binaries
        run: |
          unset LD_LIBRARY_PATH

          qemu-${{ matrix.arch.qemu_arch }} -L /usr/${{ matrix.arch.gnu_host }}/ ./bin/hello_server &
          SERVER_PID=$!
          sleep 1

          out=$(qemu-${{ matrix.arch.qemu_arch }} -L /usr/${{ matrix.arch.gnu_host }}/ ./bin/hello_client John)
          kill $SERVER_PID 2>/dev/null || true

          if ! echo "$out" | grep -q "Hello, John!" ; then
            echo "Binary output is not ok"
            echo "$out"
            exit 1
          fi
