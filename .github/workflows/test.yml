name: Test
on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize]

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: latest
            debian_version: bookworm-slim
            grpc_version: v1.66.2
          - name: legacy
            debian_version: bullseye-slim
            grpc_version: v1.37.1
    name: test (${{ matrix.name }})
    steps:
      - name: Setup deps
        run: |
          sudo apt-get update && \
          sudo apt-get install -y gcc-arm-linux-gnueabihf \
            libc6-dev-armhf-cross \
            qemu-user
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # https://docs.github.com/en/actions/using-workflows/caching-dependencies-to-speed-up-workflows
      - name: Cache Docker
        uses: actions/cache@v4
        env:
          cache-name: docker-cache
        with:
          path: /tmp/cache
          key: ${{ runner.os }}-${{ matrix.name }}-${{ env.cache-name }}-${{ hashFiles('src/*', 'Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.name }}-${{ env.cache-name }}-
            ${{ runner.os }}-${{ matrix.name }}-

      - name: Compile the binaries
        env:
          BUILDX_BAKE_ENTITLEMENTS_FS: "0"
          DEBIAN_VERSION: ${{ matrix.debian_version }}
          GRPC_VERSION: ${{ matrix.grpc_version }}
          CACHE: /tmp/cache
        run: docker buildx bake --allow=fs=/tmp

      # NOTE: Target binaries require target glibc <= runner sysroot glibc.
      - name: Verify the binaries
        run: |
          unset LD_LIBRARY_PATH

          qemu-arm -L /usr/arm-linux-gnueabihf/ ./bin/hello_server &
          SERVER_PID=$!
          sleep 1

          out=$(qemu-arm -L /usr/arm-linux-gnueabihf/ ./bin/hello_client John)
          kill $SERVER_PID 2>/dev/null || true

          if ! echo "$out" | grep -q "Hello, John!" ; then
            echo "Binary output is not ok"
            echo "$out"
            exit 1
          fi
